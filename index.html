<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fumadocs re-implemented with Vue 3 + TSX — MDX, page tree, full-text search, code highlighting, dark mode, i18n." />
    <meta property="og:site_name" content="Fumadocs Vue" />
    <meta property="og:type" content="article" />
    <meta property="og:image" content="/og/index.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Fumadocs Vue</title>
    <script>
      // avoid dark-mode flash
      try {
        const t = localStorage.getItem('fd-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/Main.tsx"></script>
  </body>
</html>
